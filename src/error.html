<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · SkyBu</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: system-ui, sans-serif;
				background: #f8fafc;
				color: #0f172a;
			}
			main {
				max-width: 28rem;
				padding: 2rem;
				text-align: center;
			}
			p.status {
				font-size: 0.875rem;
				font-weight: 600;
				color: #64748b;
			}
			a {
				color: #2563eb;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="status">Error %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p><a href="/">Volver al inicio</a></p>
		</main>
	</body>
</html>
